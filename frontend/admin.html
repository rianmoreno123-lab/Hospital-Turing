<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador</title>

    <link rel="stylesheet" href="estilo_admin.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <div class="dashboard">
     
        <aside class="sidebar">
            <div class="logo">
                <span class="material-symbols-outlined">monitor_heart</span>
                Hospital Turing
            </div>
            <nav class="menu">
                <a href="#" id="link-pacientes"><span class="material-symbols-outlined">medical_information</span> Pacientes</a>
            </nav>
            <a href="index.html" class="sair"><span class="material-symbols-outlined">logout</span> Sair</a>
        </aside>

  
        <main class="conteudo">
            <header class="topo">
                <div>
                    
                    <h1>Bem-vindo, <span id="nome-admin">Carregando...</span>!</h1>
                    <p>Painel de controle do sistema.</p>
                </div>
                <div class="avatar" id="avatar-admin">?</div>
            </header>


          
            <section id="secao-pacientes" style="margin-top: 30px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="font-family: 'Georgia', serif; color: #174D49; font-weight: normal;">Gerenciar Pacientes</h2>
                    <button id="btn-novo-paciente" style="background-color: #1D655C; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                        + Novo Paciente
                    </button>
                </div>

                <div class="card" style="padding: 0; overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="background-color: #F5F7F3; border-bottom: 1px solid #ddd;">
                                <th style="padding: 15px;">Nome</th>
                                <th style="padding: 15px;">CPF</th>
                                <th style="padding: 15px;">Nascimento</th>
                                <th style="padding: 15px;">Telefone</th>
                                <th style="padding: 15px;">Endereço</th>
                                <th style="padding: 15px; text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-pacientes">
                          
                        </tbody>
                    </table>
                </div>
            </section>
        </main> 
    </div>

    <div id="modal-paciente" class="modal escondido">
        <div class="modal-conteudo">
            <h2 id="titulo-modal-paciente">Novo Paciente</h2>
            
            <form id="form-paciente">
                <input type="hidden" id="id-paciente-edicao">
                
                <div class="campo">
                    <label>Nome Completo:</label>
                    <input type="text" id="p-nome" required>
                </div>
                <div class="campo">
                    <label>CPF (apenas 11 números):</label>
                    <input type="text" id="p-cpf" maxlength="11" required>
                </div>
                <div class="campo">
                    <label>Data de Nascimento:</label>
                    <input type="date" id="p-dataNascimento" required>
                </div>
                <div class="campo">
                    <label>Telefone:</label>
                    <input type="text" id="p-telefone">
                </div>
                <div class="campo">
                    <label>Endereço:</label>
                    <input type="text" id="p-endereco">
                </div>
                
                <button type="submit" class="botao-entrar" style="width: 100%;">Salvar</button>
                <button type="button" id="btn-fechar-modal-paciente" class="botao-fechar" style="width: 100%; background: transparent; color: #d9534f; border: none; margin-top: 15px; cursor: pointer; font-weight: bold;">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Conectando o JavaScript -->
    <script src="js/js_admin.js"></script>
</body>
</html>
