<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pagina de Acesso </title>
    <link rel="stylesheet" href="estilo.css"> <!-- conectando os arquivos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- usarei uma biblioteca para os icones e essa que ta aqui encima ai o-->
 </head>
<body>


     <div class = "pagina-acesso"> 
             

        <div class = "lado-verde" > <!-- um lado da pagina e verde, configuraçao desse lado -->
          

                  <div class="logo-area">
                    <div class="icone-logo">
                    <span class="material-symbols-outlined">monitor_heart</span>
                    </div>
                    <span>Hospital Turing</span>
                  </div>


             <div class = "texto-principal" >
             <h1> Cuidar da saúde 
             <br> sempre começa 
             <br> com clareza.
             </h1> 
             </div> 

               <button class="botao-conheca">
               <span class="material-symbols-outlined">info</span>
               Conheça o Hospital Turing </button>
        </div>

    

     
        <div  class = "lado-branco" > <!-- outro lado da pagina é branco, configuraçao desse lado -->
            <div class = "caixa-de-login" >
               <h2>Página de Acesso</h2>
               <p>Escolha um perfil correspondente para acessar sua conta. </p>
               <br>
               <p>Perfis: </p>

                    <div class="area-perfis">
    <button class="perfil ativo" data-perfil="paciente">
        <span class="material-symbols-outlined">person</span>
        Paciente
    </button>
    
    <button class="perfil" data-perfil="profissional">
        <span class="material-symbols-outlined">stethoscope</span>
        Profissional da Saúde
    </button>
    
    <button class="perfil" data-perfil="atendente">
        <span class="material-symbols-outlined">headset_mic</span>
        Atendente
    </button>
    
    <button class="perfil" data-perfil="administrador">
        <span class="material-symbols-outlined">admin_panel_settings</span>
        Administrador
    </button>
</div>



               <form>
                     <div class="campo" > <!-- com o div criamos um container que engloba a estrutura que colocamos nao pag -->
                      <label for="email" >E-mail:</label> <!-- texto pequeno encima do campo email (o for liga a caixinha no texto)-->
                      <input type= "email" id ="email" placeholder="Digite seu e-mail" required> <!-- imput  e o local onde sera colocado o e-mail-->
                     </div> <!--  placeholder e o texto que fica dentro da caixa do e-mail vazia-->

                     <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                     </div>

                    

                     <button type="submit" class="botao-entrar"> ENTRAR </button> <!-- botão para entrar -->


                    <div class="link-ajuda">
                    <p>Ainda não tem conta? <a href="#">Cadastre-se como paciente</a></p>
                    </div>
                </form>


             </div>


<div id="modal-cadastro" class="modal escondido">
    <div class="modal-conteudo">
        
        <h2>Cadastro</h2>
        
        <!-- Formulario  -->
        <form id="form-cadastro-paciente">
            <div class="campo">
                <label>Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label>CPF (apenas 11 números):</label>
                <input type="text" id="cpf" maxlength="11" required>
            </div>
            <div class="campo">
                <label>Data de Nascimento:</label>
                <input type="date" id="dataNascimento" required>
            </div>
            <div class="campo">
                <label>Telefone:</label>
                <input type="text" id="telefone">
            </div>
            <div class="campo">
                <label>Endereço:</label>
                <input type="text" id="endereco">
            </div>
            <button type="submit" class="botao-entrar">Cadastrar</button>
            <button type="button" id="botao-fechar-modal" class="botao-fechar">Cancelar</button>
        </form>

    </div>
</div>

         </div>
     </div>

<script src="js/script.js"></script>
<!-- conecta como java script -->
</body>
</html>
